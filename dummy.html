<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recharge Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <h2>Mobile Recharge Payment</h2>

    <form id="paymentForm">
        <label for="mobile">Mobile Number:</label>
        <input type="text" id="mobile" name="mobile" required><br><br>

        <label for="plan">Plan:</label>
        <select id="plan" name="plan" required>
            <option value="299">299/- Plan</option>
            <option value="399">399/- Plan</option>
            <option value="599">599/- Plan</option>
            <option value="799">799/- Plan</option>
            <option value="999">999/- Plan</option>
            <option value="1299">1299/- Plan</option>
            <option value="1399">1399/- Plan</option>
        </select><br><br>

        <button type="button" id="payButton">Pay Now</button>
    </form>

    <script>
        document.getElementById("payButton").addEventListener("click", function () {
            const mobile = document.getElementById("mobile").value;
            const planAmount = document.getElementById("plan").value;
            const planName = document.getElementById("plan").options[document.getElementById("plan").selectedIndex].text;

            if (!mobile || !planAmount) {
                alert("Please enter all details.");
                return;
            }
            
            // Call backend to create order
            fetch("http://localhost:8075/api/payment/createOrder", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    mobileNumber: mobile,
                    planAmount: planAmount,
                    planName: planName
                })
            })
            .then(response => response.json())
            .then(data => {
                const options = {
                    key: "rzp_test_W4BF3Z96SbtPpX", // Replace with your Razorpay test key
                    amount: data.amount,
                    currency: "INR",
                    name: "Mobile Recharge",
                    description: "Plan Recharge Payment",
                    order_id: data.orderId,
                    handler: function (response) {
                        // Send payment success details to backend
                        fetch("http://localhost:8075/api/payment/confirmPayment", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                mobileNumber: mobile,
                                planAmount: planAmount,
                                planName: planName,
                                paymentId: response.razorpay_payment_id,
                                orderId: response.razorpay_order_id,
                                signature: response.razorpay_signature
                            })
                        })
                        .then(res => res.json())
                        .then(result => {
                            if (result.success) {
                                alert("Payment Successful! Recharge confirmed.");
                            } else {
                                alert("Payment failed, please try again.");
                            }
                        });
                    },
                    theme: {
                        color: "#3399cc"
                    }
                };

                const rzp1 = new Razorpay(options);
                rzp1.open();
            })
            .catch(error => console.error("Error:", error));
        });
    </script>

</body>
</html>
